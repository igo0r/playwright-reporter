name: Playwright Tests
on:
  pull_request:
    branches: [ main ]
permissions:
  pull-requests: write
  contents: read
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Extract summary
      id: summary
      run: |
        passed=$(jq '.stats.expected' tests-results.json)
        failed=$(jq '.stats.unexpected' tests-results.json)
        skipped=$(jq '.stats.skipped' tests-results.json)
        echo "summary=✅ $passed passed 🛑 $failes failed 🟡 $skipped skipped" >> GITHUB_OUTPUT
    - name: Create comment
      uses: peter-evans/create-or-update-comment@v5
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          ## Playwright test results
          ${{ steps.summary.outputs.summary }}
